<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geräte-Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(135deg, #013154 0%, #0a4d7e 100%);
        min-height: 100vh;
        color: #fff;
      }
      .container-fluid {
        padding: 40px 20px;
      }
      .header {
        text-align: center;
        margin-bottom: 40px;
      }
      .header h1 {
        font-weight: 900;
        font-size: 48px;
        margin-bottom: 10px;
      }
      .header p {
        font-size: 18px;
        opacity: 0.9;
      }
      .device-card {
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }
      .device-card.online {
        border-color: rgba(40, 167, 69, 0.5);
        background: rgba(40, 167, 69, 0.1);
      }
      .device-card:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.15);
      }
      .device-card.online:hover {
        background: rgba(40, 167, 69, 0.15);
      }
      .device-status {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .status-indicator {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }
      .status-indicator.online {
        background: #28a745;
        box-shadow: 0 0 8px rgba(40, 167, 69, 0.6);
      }
      .status-indicator.offline {
        background: #6c757d;
        animation: none;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .device-name {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .device-info {
        font-size: 14px;
        opacity: 0.8;
        line-height: 1.6;
      }
      .device-info strong {
        opacity: 1;
      }
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        opacity: 0.8;
      }
      .empty-state-icon {
        font-size: 64px;
        margin-bottom: 20px;
      }
      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
      }
      .refresh-info {
        text-align: center;
        font-size: 12px;
        opacity: 0.6;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="header">
        <h1>Geräte-Status</h1>
        <p>Verbundene Infoscreen-Systeme</p>
      </div>

      <div id="devicesContainer">
        <div class="empty-state">
          <div class="empty-state-icon">⏳</div>
          <p>Laden...</p>
        </div>
      </div>

      <div class="refresh-info">
        Automatische Aktualisierung aktiv · Letzte Aktualisierung: <span id="lastUpdate">–</span>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      function formatRelativeTime(isoString) {
        if (!isoString) return '–';
        const diff = Date.now() - new Date(isoString).getTime();
        const sec = Math.floor(diff / 1000);
        if (sec < 5) return 'gerade eben';
        if (sec < 60) return `vor ${sec} Sek.`;
        const min = Math.floor(sec / 60);
        if (min < 60) return `vor ${min} Min.`;
        const hours = Math.floor(min / 60);
        if (hours < 24) return `vor ${hours} Std.`;
        return new Date(isoString).toLocaleDateString('de-DE', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderDevices(clients) {
        const container = document.getElementById('devicesContainer');

        if (!clients || clients.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🔌</div>
              <p>Keine Geräte bekannt.</p>
            </div>
          `;
          return;
        }

        const onlineDevices = clients.filter((c) => Boolean(c.online));
        const offlineDevices = clients.filter((c) => !c.online);

        let html = '';

        if (onlineDevices.length > 0) {
          html += '<h2 style="color:#fff; font-size:20px; font-weight:700; margin-bottom:20px;">● Online (' + onlineDevices.length + ')</h2>';
          html += '<div class="grid-container">';
          html += onlineDevices
            .map(
              (c) => `
            <div class="device-card online">
              <div class="device-status">
                <span class="status-indicator online"></span>
                <span style="font-weight:600;">Verbunden</span>
              </div>
              <div class="device-name">${escapeHtml(c.name)}</div>
              <div class="device-info">
                <div><strong>Zuletzt:</strong> ${formatRelativeTime(c.last_seen)}</div>
                <div><strong>Seit:</strong> ${new Date(c.created_at).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })}</div>
              </div>
            </div>
          `
            )
            .join('');
          html += '</div>';
        }

        if (offlineDevices.length > 0) {
          html += '<h2 style="color:#fff; font-size:20px; font-weight:700; margin-bottom:20px; margin-top:40px;">● Offline (' + offlineDevices.length + ')</h2>';
          html += '<div class="grid-container">';
          html += offlineDevices
            .map(
              (c) => `
            <div class="device-card">
              <div class="device-status">
                <span class="status-indicator offline"></span>
                <span style="font-weight:600;">Offline</span>
              </div>
              <div class="device-name">${escapeHtml(c.name)}</div>
              <div class="device-info">
                <div><strong>Zuletzt:</strong> ${formatRelativeTime(c.last_seen)}</div>
                <div><strong>Seit:</strong> ${new Date(c.created_at).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })}</div>
              </div>
            </div>
          `
            )
            .join('');
          html += '</div>';
        }

        container.innerHTML = html;
      }

      async function loadDevices() {
        try {
          const response = await fetch('/api/public/clients');
          const clients = await response.json();
          renderDevices(clients);
          document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('de-DE', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
          });
        } catch (_error) {
          const container = document.getElementById('devicesContainer');
          container.innerHTML =
            '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>Fehler beim Laden der Geräteliste.</p></div>';
        }
      }

      // Initial load
      loadDevices();

      // Socket.IO für Live-Updates
      const socket = io();
      socket.on('connect', () => {
        socket.emit('client:register', { role: 'admin' });
      });

      socket.on('admin:client-list', (clients) => {
        renderDevices(clients);
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('de-DE', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
      });

      // Automatischer Reload beim Tageswechsel
      function scheduleMidnightReload() {
        const now = new Date();
        const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 1, 0, 0); // 00:01 Uhr
        const ms = next - now;
        setTimeout(() => {
          loadDevices();
          scheduleMidnightReload();
        }, ms);
      }
      scheduleMidnightReload();
    </script>
  </body>
</html>
